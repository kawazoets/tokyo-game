for(let i=0;i<30;i++){let x=i*49;poly([[x-7,0,1],[x+7,0,1],[x+7,HEIGHT,1],[x-7,HEIGHT,1]],'#929ca1');if(i%3===0)poly([[x-1,0,2],[x+1,0,2],[x+1,HEIGHT,2],[x-1,HEIGHT,2]],'#c6bda6')}for(let j=0;j<24;j++){let y=j*45;poly([[0,y-7,1],[WORLD,y-7,1],[WORLD,y+7,1],[0,y+7,1]],'#929ca1')}
let objects=[...buildings,...extra].map(b=>({kind:'building',obj:b,sort:b.x+b.y}));stations.forEach(s=>objects.push({kind:'station',obj:s,sort:s.x+s.y+50}));objects.sort((a,b)=>a.sort-b.sort);for(let o of objects){if(o.kind==='station')station(o.obj);else block(o.obj)}
// Raised, visible Yamanote track, rendered above the buildings so it cannot disappear behind them.
let points=track.map(p=>iso(p.x,p.y,23));
line([...points,points[0]],'#43525a',23);
line([...points,points[0]],'#a6adb0',18);
for(let i=0;i<track.length;i++){
 let a=track[i],b=track[(i+1)%track.length];
 for(let j=0;j<7;j++){
  let t=j/7,x=a.x+(b.x-a.x)*t,y=a.y+(b.y-a.y)*t;
  let vx=b.x-a.x,vy=b.y-a.y,m=Math.hypot(vx,vy)||1;
  line([iso(x-vy/m*13,y+vx/m*13,24),iso(x+vy/m*13,y-vx/m*13,24)],'#695f56',2.5);
 }
}
for(let offset of [-6,6]){
 let railPoints=track.map((p,i)=>{let before=track[(i+track.length-1)%track.length],after=track[(i+1)%track.length],vx=after.x-before.x,vy=after.y-before.y,m=Math.hypot(vx,vy)||1;return iso(p.x-vy/m*offset,p.y+vx/m*offset,25)});

}
for(let i=0;i<track.length;i++){let a=iso(track[i].x,track[i].y,22),b=iso(track[i].x,track[i].y,0);line([a,b],'#657b80',2.8)}
// Render platforms above the elevated rails, before trains so cars remain visible.
for(const s of stations){if(s.trackIndex>=0)platform(s)}
landmark(510,490,'tower');landmark(1120,240,'skytree');landmark(830,660,'dome');
// Isometric 3D train: each car has a roof, two vertical sides, end caps, doors and windows.
function trainCar(x,y,dx,dy,lead){
 const L=42,half=9,z0=21,z1=39,mag=Math.hypot(dx,dy)||1;
 let ux=dx/mag,uy=dy/mag,vx=-uy,vy=ux;
 function corner(along,side,z){return iso(x+ux*along+vx*side,y+uy*along+vy*side,z)}
 const A=corner(-L/2,-half,z0),B=corner(L/2,-half,z0),C=corner(L/2,half,z0),D=corner(-L/2,half,z0);
 const At=corner(-L/2,-half,z1),Bt=corner(L/2,-half,z1),Ct=corner(L/2,half,z1),Dt=corner(-L/2,half,z1);
 // Visible walls are shaded differently to make volume unmistakable.
 path([D,C,Ct,Dt],'#d7e0e0','#4a6065',1.2);
 path([B,C,Ct,Bt],'#a7b8bb','#4a6065',1.2);
 path([A,B,Bt,At],'#f0f3f1','#4a6065',1.1);
 path([A,D,Dt,At],'#9baeb2','#4a6065',1.1);
 path([At,Bt,Ct,Dt],'#e9f0ed','#60787a',1.3);
 // Raised roof vent.
 path([corner(-9,-3,z1+1),corner(10,-3,z1+1),corner(10,3,z1+1),corner(-9,3,z1+1)],'#b6c5c5','#819494',.8);
 // Full-length Yamanote green stripe, along BOTH sides.
 for(const side of [-1,1]){
  const face=[corner(-L/2,side,z0+5),corner(L/2,side,z0+5),corner(L/2,side,z0+10),corner(-L/2,side,z0+10)];
  path(face,'#69ad71');
  for(let j=0;j<4;j++){
   const aa=-L/2+4+j*9;
   path([corner(aa,side,z0+12),corner(aa+6,side,z0+12),corner(aa+6,side,z0+17),corner(aa,side,z0+17)],'#426d7b','#e8f4f4',.45);
  }
  // Door frame between windows.
  line([corner(1,side,z0+1),corner(1,side,z0+17)],'#738f92',1);
 }
 // Front windshield and lights at the leading end.
 if(lead){
  path([corner(L/2,-6,z0+11),corner(L/2,6,z0+11),corner(L/2,6,z0+17),corner(L/2,-6,z0+17)],'#345d69','#edf7f3',.8);
  for(let side of [-6,6]){let q=corner(L/2,side,z0+5);ctx.fillStyle='#fff2a4';ctx.beginPath();ctx.arc(q.x,q.y,1.8,0,Math.PI*2);ctx.fill()}
 }
}
// Pause only at stations that have received a name. Stops last 2.2 seconds.
let now=performance.now(),dt=Math.min((now-(window._lastTrainFrame||now))/1000,.08);window._lastTrainFrame=now;
if(window._stopRemaining>0){window._stopRemaining-=dt;if(window._stopRemaining<0)window._stopRemaining=0;}
else {
 let before=trainTime,after=before+dt*.44;
 for(let s of stations){
  if(!placed[s.id] || s.trackIndex===undefined || s.trackIndex<0)continue;
  let idx=s.trackIndex;
  if(Math.floor((before-idx)/30)<Math.floor((after-idx)/30)){
    trainTime=idx+30*Math.floor((after-idx)/30);
    window._stopRemaining=2.2;
    window._stoppingAt=s.id;
    break;
  }
 }
 if(!window._stopRemaining){trainTime=after;window._stoppingAt=null;}
}
let tt=((trainTime%track.length)+track.length)%track.length;
for(let car=5;car>=0;car--){
 let t=(tt-car*.16+track.length)%track.length,i=Math.floor(t),f=t-i;
 let a=track[i],b=track[(i+1)%track.length];
 let x=a.x+(b.x-a.x)*f,y=a.y+(b.y-a.y)*f;
 trainCar(x,y,b.x-a.x,b.y-a.y,car===0);
}
// One compact station nameplate per station, no double white boxes or tall stalks.
for(let s of stations){
 const foot=iso(s.x,s.y,27),marker=iso(s.x,s.y,64);
 ctx.beginPath();ctx.arc(foot.x,foot.y,4,0,Math.PI*2);ctx.fillStyle='#158c62';ctx.fill();
 const label=placed[s.id]||'';ctx.font='bold 10px sans-serif';
 const boxW=placed[s.id]?Math.max(33,Math.min(135,ctx.measureText(label).width+12)):33;
 ctx.fillStyle=window._stoppingAt===s.id&&window._stopRemaining>0?'#fff0b4':'#f9faf7';ctx.strokeStyle='#37736a';ctx.lineWidth=1;
 ctx.beginPath();ctx.roundRect(marker.x-boxW/2,marker.y-9,boxW,18,3);ctx.fill();ctx.stroke();
 ctx.fillStyle='#194a46';ctx.textAlign='center';ctx.fillText(label,marker.x,marker.y+3.5);
}
if(hover&&tool!=='move'){let p=iso(hover.x,hover.y,0);ctx.strokeStyle='#087b84';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,22,0,Math.PI*2);ctx.stroke()}ctx.restore();requestAnimationFrame(draw)}
function worldToScreen(x,y,z=0){let p=iso(x,y,z),center=iso(WORLD/2,HEIGHT/2);return {x:W/2+panX+(p.x-center.x)*zoom,y:H/2+panY+110+(p.y-center.y)*zoom}}function screenToWorld(x,y){let center=iso(WORLD/2,HEIGHT/2),px=(x-W/2-panX)/zoom+center.x,py=(y-H/2-panY-110)/zoom+center.y;return {x:py/(2*.405)+px/(2*.78),y:py/(2*.405)-px/(2*.78)}}function nearestStation(x,y){let best=null,dist=999;for(let s of stations){let p=worldToScreen(s.x,s.y,64),d=Math.hypot(x-p.x,y-p.y);if(d<dist){dist=d;best=s}}return dist<Math.max(17,25*zoom)?best:null}function position(e){let r=c.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}}
let start=null;c.addEventListener('pointerdown',e=>{let p=position(e);start={...p,panX,panY,moved:false};c.setPointerCapture(e.pointerId);if(tool==='move')c.style.cursor='grabbing'});c.addEventListener('pointermove',e=>{let p=position(e);if(start){let dx=p.x-start.x,dy=p.y-start.y;if(Math.hypot(dx,dy)>5)start.moved=true;if(tool==='move'||start.moved){panX=start.panX+dx;panY=start.panY+dy}}else hover=screenToWorld(p.x,p.y)});c.addEventListener('pointerup',e=>{if(!start)return;let p=position(e);if(!start.moved){let s=nearestStation(p.x,p.y);if(s&&tool==='move'&&placed[s.id]){delete placed[s.id];document.getElementById('status').textContent='駅名を消しました';}else if(tool!=='move'){let q=screenToWorld(p.x,p.y);if(q.x>0&&q.x<WORLD&&q.y>0&&q.y<HEIGHT){if(tool==='station'){let id=stations.length;stations.push({id,x:q.x,y:q.y,trackIndex:-1});}else{let h=tool==='tower'?130:tool==='office'?85:tool==='shop'?38:tool==='house'?37:0;extra.push({x:q.x,y:q.y,w:tool==='tower'?56:48,d:tool==='tower'?50:42,h,type:tool,seed:extra.length+999})}}}}start=null;c.style.cursor=tool==='move'?'grab':'crosshair'});c.addEventListener('pointercancel',()=>start=null);c.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.38,Math.min(2.2,zoom*(e.deltaY<0?1.1:.9)))},{passive:false});document.getElementById('plus').onclick=()=>zoom=Math.min(2.2,zoom*1.2);document.getElementById('minus').onclick=()=>zoom=Math.max(.38,zoom/1.2);document.getElementById('home').onclick=()=>{zoom=.83;panX=panY=0};document.getElementById('undo').onclick=()=>extra.pop();document.getElementById('reset').onclick=()=>{if(confirm('街を最初の状態に戻しますか？'))init()};
// Pointer-driven label dragging supports mouse and touch.
cards.addEventListener('pointerdown',e=>{let t=e.target.closest('.chip');if(!t)return;e.preventDefault();let g=document.createElement('div');g.textContent=t.dataset.name;Object.assign(g.style,{position:'fixed',zIndex:1000,pointerEvents:'none',background:'#fff',border:'2px solid #27838a',borderRadius:'6px',padding:'5px 9px',fontWeight:'bold',boxShadow:'0 3px 10px #0003'});document.body.appendChild(g);cardDrag={name:t.dataset.name,ghost:g};moveGhost(e)});function moveGhost(e){if(cardDrag){cardDrag.ghost.style.left=e.clientX+12+'px';cardDrag.ghost.style.top=e.clientY+12+'px'}}window.addEventListener('pointermove',moveGhost);window.addEventListener('pointerup',e=>{if(!cardDrag)return;let r=c.getBoundingClientRect();let s=nearestStation(e.clientX-r.left,e.clientY-r.top);if(s&&e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom){placed[s.id]=cardDrag.name;document.getElementById('status').textContent='「'+cardDrag.name+'」を駅につけました！'}cardDrag.ghost.remove();cardDrag=null});requestAnimationFrame(draw);
